# ─────────────────────────────────────────────────────────────────────────────
# Puerta de seguridad en CI — JHOCA LABS (DevSecOps)
# Copiar a cada repo como  .github/workflows/security.yml
#
# Rompe el build ante: secretos (working tree + historial), CVEs CRÍTICAS/ALTAS
# con fix disponible, misconfiguraciones de IaC/Docker, y hallazgos SAST de alta
# confianza. Cubre A-SEC-01, A-DEP-01 [BLOQ], A-DEP-04, I-IMG-01 [BLOQ].
#
# Es políglota: los pasos se auto-activan según lo que haya en el repo
# (requirements.txt, lockfiles npm/pnpm, Dockerfile…). No hace falta tocar nada.
# Excepciones (falsos positivos / riesgo aceptado): .trivyignore + .gitleaks.toml,
# y se registran en gobierno/REGISTRO-EXCEPCIONES.md con caducidad.
# ─────────────────────────────────────────────────────────────────────────────
name: security

on:
  push:
    branches: [main, master, develop, staging]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # lunes 06:00 UTC — recoge CVEs nuevas sin tocar código
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # gitleaks lista los commits del PR vía API

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secretos:
    name: Secretos (gitleaks · árbol + historial)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historial completo: atrapa secretos ya commiteados
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # requerido para escanear PRs
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml

  codigo-y-deps:
    name: CVEs + IaC + SAST (trivy · semgrep · pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── MODO BASELINE (adopción) ───────────────────────────────────────────
      # Al introducir el gate en un repo con deuda histórica NO se bloquea por
      # esa deuda (si no, ningún PR mergea). Bloquea solo lo de deuda ~nula y
      # alto valor: secretos (gitleaks, job aparte) + misconfig de IaC/Docker.
      # CVEs de dependencias y SAST entran REPORT-ONLY; se queman por repo y,
      # cuando el repo llega a cero, se cambia exit-code/continue-on-error a
      # bloqueante (ver README · se registra en gobierno/REGISTRO-EXCEPCIONES).

      # Trivy por script oficial (evita depender de versiones del action).
      - name: Instalar Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

      # BLOQUEANTE — misconfig de IaC/Docker + secretos en el árbol.
      # (trivy lee .trivyignore de la raíz automáticamente.)
      - name: Trivy — misconfig + secretos (bloqueante)
        run: |
          trivy fs --scanners misconfig,secret \
            --severity CRITICAL,HIGH --exit-code 1 --no-progress \
            --skip-dirs node_modules,.next,dist,build .

      # REPORT-ONLY (baseline) — CVEs de dependencias. Informan, no rompen.
      # Flip a bloqueante: cambiar --exit-code 0 por 1 cuando el repo quede en cero.
      - name: Trivy — CVEs de dependencias (informativo)
        run: |
          trivy fs --scanners vuln \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 --no-progress \
            --skip-dirs node_modules,.next,dist,build .

      # SAST: inyección, SSRF, path traversal, authz rota… ERROR = alta confianza.
      # REPORT-ONLY en baseline (continue-on-error). Quitar al limpiar el repo.
      - name: Semgrep (SAST · informativo en baseline)
        continue-on-error: true
        run: |
          pipx install semgrep || pip install --user semgrep
          semgrep scan \
            --config p/default \
            --config p/secrets \
            --severity ERROR \
            --error \
            --metrics off \
            --exclude node_modules --exclude .next --exclude dist --exclude build \
            .

      # Python: pip-audit es más fiel que osv para requirements.txt (lección
      # 204-vs-24). REPORT-ONLY en baseline (continue-on-error). Flip al limpiar.
      - name: pip-audit (si hay Python · informativo en baseline)
        if: ${{ hashFiles('**/requirements.txt') != '' }}
        continue-on-error: true
        run: |
          pipx install pip-audit || pip install --user pip-audit
          found=0
          while IFS= read -r -d '' req; do
            found=1
            echo "::group::pip-audit $req"
            pip-audit -r "$req" --strict || exit 1
            echo "::endgroup::"
          done < <(find . -name requirements.txt -not -path '*/node_modules/*' -print0)
          [ "$found" -eq 1 ] || echo "sin requirements.txt — nada que auditar"

  # OPCIONAL — descomentar si el repo construye su imagen en CI:
